# ?????????????????????????????????????????????????????????????????????????????
#  PRODUCTION PROFILE  ?  activated by SPRING_PROFILES_ACTIVE=prod (Dockerfile)
#  Secrets injected via Render / Railway env vars ? never hardcode here!
# ?????????????????????????????????????????????????????????????????????????????

# ?? Port (Render injects PORT; fall back to 8080 for Docker Compose) ?????????
server.port=${PORT:8080}

# ?? Database (injected from Render / K8s env) ?????????????????????????????????
spring.datasource.url=${DB_URL:jdbc:postgresql://postgres:5432/taskmanager}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:changeme}

# ?? HikariCP tuning for Render/Neon PostgreSQL ??????????????????????????????????
# Render Postgres drops idle connections after ~300s; Neon after ~60s on free tier.
# max-lifetime (240s) < server idle timeout (300s) so HikariCP retires connections first.
# keepalive-time (30s) pings open connections so they stay alive.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.auto-commit=true
# Allow HikariCP to keep trying if pool exhausted at startup (-1 = wait forever)
spring.datasource.hikari.initialization-fail-timeout=-1

# ?? JPA ???????????????????????????????????????????????????????????????????????
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.format_sql=false
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

# ?? Startup memory optimisation (critical on Render free 512 MB) ??????????????
# Lazy init: only create beans on first use ? cuts peak startup RAM ~30 %
spring.main.lazy-initialization=true
# Reduce Tomcat threads (Render free tier is single-user scale)
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=4
server.tomcat.max-connections=100
server.tomcat.accept-count=20

# ?? JWT ???????????????????????????????????????????????????????????????????????
jwt.secret=${JWT_SECRET:REPLACE_WITH_STRONG_256BIT_SECRET_IN_PRODUCTION}
jwt.expiration=86400000

# ?? CORS ? open to all origins (CORS is open; JWT handles auth security)
# To restrict later: set ALLOWED_ORIGINS=https://your-vercel-url.vercel.app
cors.allowed-origins=${ALLOWED_ORIGINS:*}

# ?? AI / Groq ?????????????????????????????????????????????????????????????????
# Set OPENAI_API_KEY in Render ? Environment
# Get a free key at https://console.groq.com (starts with gsk_)
ai.base.url=${AI_BASE_URL:https://api.groq.com/openai/v1/chat/completions}
openai.api.key=${OPENAI_API_KEY:REPLACE_WITH_YOUR_GROQ_API_KEY}
openai.model=${AI_MODEL:llama-3.3-70b-versatile}

# ?? Actuator ??????????????????????????????????????????????????????????????????
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized

# ?? Logging ???????????????????????????????????????????????????????????????????
logging.level.root=WARN
logging.level.com.kalyan=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ?? Schema init ???????????????????????????????????????????????????????????????
spring.sql.init.mode=never

# ?? Swagger / OpenAPI ?????????????????????????????????????????????????????????
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
